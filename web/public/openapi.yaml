openapi: 3.0.3
info:
  title: Aero Shop Connect API
  version: 0.2.0
  description: |
    API-only bridge to the Shopify Admin GraphQL API.

    Each client gets its own API key, tied to one shop. The key decides which shop is queried, so callers
    never pass a shop. Keys are created by the app owner with `php artisan apikey:create <shop>`.
servers:
  - url: /
    description: Same host that serves this page
security:
  - bearerAuth: []
tags:
  - name: Bridge
    description: Endpoints that proxy Shopify data
  - name: Health
    description: Liveness
paths:
  /api:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: App is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/products:
    get:
      tags: [Bridge]
      summary: List products of the key's shop
      description: |
        Runs a GraphQL `products` query against the Admin API of the shop the API key belongs to.
        Requires the `products:read` ability. Rate limited per key.
      parameters:
        - name: first
          in: query
          required: false
          description: Number of products to return (1 to 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Products of the shop
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop:
                    type: string
                    example: faysal-devstore.myshopify.com
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "401":
          description: Missing, malformed, unknown, revoked or expired API key (all return the same response)
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Unauthorized
        "403":
          description: The key lacks the required ability, or its shop has uninstalled the app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ability:
                  value:
                    error: "Forbidden: missing ability products:read"
                uninstalled:
                  value:
                    error: Shop not installed
        "429":
          description: Rate limit exceeded for this key
          headers:
            Retry-After:
              description: Seconds until the next request is allowed
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Too many requests
        "502":
          description: Shopify rejected the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Shopify request failed
                  details:
                    nullable: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_live_<id>_<secret>
      description: Your API key, for example `sk_live_1a2b3c4d_...`. Issued per client and per shop.
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          example: gid://shopify/Product/7675331313763
        title:
          type: string
          example: Short Sleeve T-shirt
        handle:
          type: string
          example: short-sleeve-t-shirt
        status:
          type: string
          enum: [ACTIVE, ARCHIVED, DRAFT]
          example: ACTIVE
        totalInventory:
          type: integer
          example: 12
    Error:
      type: object
      properties:
        error:
          type: string
